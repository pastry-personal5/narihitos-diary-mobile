name: NarihitosDiary
options:
  bundleIdPrefix: com.narihitosdiary
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${NDM_DEVELOPMENT_TEAM}
    IPHONEOS_DEPLOYMENT_TARGET: '27.0'
    TARGETED_DEVICE_FAMILY: '1'
    SWIFT_VERSION: '6.0'
targets:
  NarihitosDiary:
    type: application
    platform: iOS
    sources: [NarihitosDiary]
    dependencies:
      - framework: Vendor/TranscribeCpp.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.narihitosdiary.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record audio for your diary.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Add optional recording-time place and weather context to your diary.
        INFOPLIST_FILE: NarihitosDiary/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  NarihitosDiaryTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NarihitosDiaryTests]
    dependencies:
      - target: NarihitosDiary
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.narihitosdiary.mobile.tests
schemes:
  NarihitosDiary:
    build:
      targets:
        NarihitosDiary: all
        NarihitosDiaryTests: [test]
    test:
      targets: [NarihitosDiaryTests]
